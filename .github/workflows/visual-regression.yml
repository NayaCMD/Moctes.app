name: Visual regression

on:
  pull_request:
  push:
    branches:
      - main
      - organize/commits

jobs:
  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start isolated PostgreSQL
        run: docker compose up -d --wait postgres

      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql://moctes:moctes@localhost:5433/moctes
        run: npm run db:migrate

      - name: Backend integration tests
        env:
          DATABASE_URL: postgresql://moctes:moctes@localhost:5433/moctes
          NODE_ENV: test
        run: npm run test:e2e --workspace=backend -- --runInBand

      - name: Stop isolated services
        if: always()
        run: docker compose down --volumes

  visual-regression:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: |
          npm test --workspace=frontend
          npm test --workspace=backend -- --runInBand

      - name: Visual regression tests
        run: npm run test:visual

      - name: Build
        run: npm run build

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-diffs
          path: frontend/test-results/visual
          if-no-files-found: ignore
          retention-days: 14
